{% extends 'store/base.html' %}
{% block content %}

<div class="row">

  <div class="col-md-6">
    {% if product.image %}
        <img src="{{ product.image.url }}" class="img-fluid rounded shadow-sm" alt="{{ product.name }}">
    {% else %}
        <img src="https://via.placeholder.com/600x400?text=Sin Imagen" class="img-fluid rounded shadow-sm" alt="{{ product.name }}">
    {% endif %}
  </div>

  <div class="col-md-6">
    <h2 class="fw-bold">{{ product.name }}</h2>
    
    <p class="text-muted">Categoría: {{ product.get_category_display }}</p>
    
    <p>{{ product.description }}</p>

    <h3 class="product-price mt-3">{{ product.price }} €</h3>
    <p>Stock: {{ product.stock }}</p>

    <a href="{% url 'store:add_to_cart' product.id %}" class="btn btn-success mt-3">Añadir al carrito</a>
  </div>

</div>

{% endblock %}
