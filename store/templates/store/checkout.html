{% extends 'store/base.html' %}
{% block content %}
<h1>Finalizar compra</h1>
<div class="row">
  <div class="col-md-6">
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Enviar pedido</button>
    </form>
  </div>
  <div class="col-md-6">
    <h5>Resumen</h5>
    <ul class="list-group">
      {% for it in items %}
        <li class="list-group-item">{{ it.quantity }} x {{ it.product.name }} - {{ it.product.price }} €</li>
      {% endfor %}
    </ul>
    <p class="mt-3"><strong>Total: {{ total }} €</strong></p>
  </div>
</div>
{% endblock %}
